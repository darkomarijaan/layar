[package]
name = "layar"
version = "0.2.0"
edition = "2024"
description = "A video player: egui interface, libmpv playback"

[[bin]]
name = "Layar"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
libmpv2 = "7.0.1"
rfd = "0.18.0"
serde_json = "1.0.154"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
