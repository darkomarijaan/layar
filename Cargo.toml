[package]
name = "layar"
version = "0.3.2"
edition = "2024"
description = "A video player: egui interface, libmpv playback"
license = "MIT"

[[bin]]
name = "Layar"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libmpv2 = "7.0.1"
rfd = "0.18.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
